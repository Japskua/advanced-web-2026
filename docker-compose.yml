# Local infrastructure for the course.
#
#   bun run services:up      (or: docker compose up -d)
#   bun run services:down    (or: docker compose down)
#
# Add `-v` to `docker compose down` to also delete the database volume and start
# from scratch.

services:
  # PostgreSQL for weeks 6, 7, 8, 11 and 12. Every week gets its own database
  # (see docker/postgres-init.sql), so the weeks never interfere with each other.
  postgres:
    image: postgres:18-alpine
    container_name: awa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Azurite emulates Azure Blob Storage for week 12, so the encrypted file vault
  # runs locally without an Azure account. Connection string:
  #   AZURE_STORAGE_CONNECTION_STRING=UseDevelopmentStorage=true
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: awa-azurite
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

volumes:
  postgres-data:
  azurite-data:
