# Local infrastructure for the course.
#
#   bun run services:up      (or: docker compose up -d)
#   bun run services:down    (or: docker compose down)
#
# Add `-v` to `docker compose down` to also delete the database volume and start
# from scratch.

services:
  # PostgreSQL for weeks 6, 7, 8, 11 and 12. Every week gets its own database
  # (see docker/postgres-init.sql), so the weeks never interfere with each other.
  postgres:
    image: postgres:18-alpine
    container_name: awa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for week 12: SeaweedFS in its single-process
  # "mini" mode. Bun's built-in S3 client talks to it exactly as it would to
  # Hetzner Object Storage, DigitalOcean Spaces or AWS S3. It creates the
  # bucket on startup; the credentials below are for local development only.
  #   S3_ENDPOINT=http://localhost:8333  S3_BUCKET=encrypted-files
  object-storage:
    image: chrislusf/seaweedfs:4.48
    container_name: awa-object-storage
    command: mini -dir=/data -bucket=encrypted-files
    environment:
      AWS_ACCESS_KEY_ID: awa-dev-access-key
      AWS_SECRET_ACCESS_KEY: awa-dev-secret-key
    ports:
      - "8333:8333"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  object-storage-data:
